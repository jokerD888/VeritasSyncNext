[package]
name = "veritassync-tracker"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
base64 = "0.22"
blake3 = "1"
ed25519-dalek = "2"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

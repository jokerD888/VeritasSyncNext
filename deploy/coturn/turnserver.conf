# Development-only coturn configuration. Set the passwords through Docker Compose
# environment expansion; do not commit credentials or production certificates.
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
realm=veritassync.dev
use-auth-secret
static-auth-secret=__TURN_SHARED_SECRET__
no-multicast-peers
no-cli
min-port=49160
max-port=49200
# For TLS:443 deployments, provide real certificate and private-key paths via a
# production-only override; never use this development file as a public deployment.

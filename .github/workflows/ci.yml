name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # Match the VS 2022 generator in CMakePresets.json; latest can migrate to VS 2026.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify Visual Studio 2022 toolchain
        shell: pwsh
        run: ./scripts/check-windows-toolchain.ps1
      - uses: dtolnay/rust-toolchain@stable
      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { throw 'Corepack setup failed' }
          $packageManager = (Get-Content desktop/ui/package.json -Raw | ConvertFrom-Json).packageManager
          corepack install --global $packageManager
          if ($LASTEXITCODE -ne 0) { throw 'Pinned pnpm installation failed' }
      - name: Configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset default -DCMAKE_CXX_CLANG_TIDY=clang-tidy
      - name: Build
        run: cmake --build --preset default --parallel
      - name: Test
        run: ctest --preset default --output-on-failure
      - name: Test local two-process synchronization
        shell: pwsh
        run: ./scripts/test-local-sync.ps1
      - name: Test Tracker
        run: cargo test --locked --manifest-path tracker/Cargo.toml
      - name: Validate desktop UI
        shell: pwsh
        working-directory: desktop/ui
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed' }
          pnpm lint
          if ($LASTEXITCODE -ne 0) { throw 'Frontend typecheck failed' }
          pnpm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
          pnpm build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
      - name: Test desktop Rust shell
        shell: pwsh
        run: |
          ./scripts/stage-desktop-engine.ps1
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

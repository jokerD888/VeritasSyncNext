[package]
name = "veritassync-desktop"
version = "0.1.0-2"
description = "VeritasSyncNext desktop shell"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
log = "0.4"
reqwest = { version = "0.13", features = ["json"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
zeroize = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

# The shell is mostly orchestration around WebView2 and the independent C++
# engine. Optimize its distributable for size while retaining ThinLTO's useful
# cross-crate dead-code elimination without the cost of full LTO.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
